name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - run: dotnet publish src/TextGrab.Windows -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: TextGrab-win-x64
          path: src/TextGrab.Windows/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/TextGrab.exe
